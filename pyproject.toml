[project]
name = "md-webdav"
version = "0.1.0"
description = "A minimal WebDAV-backed file backup CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28.1,<0.29",
    "webdav4>=0.11.0,<0.12",
]

[project.scripts]
md = "md_webdav.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
